<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Out of Office Writer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #eef3f8 0%, #d9e4f0 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #1f3350;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #2c5aa0; font-weight: 800; }
  .subtitle { color: #52698c; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #ffffff;
    border: 2px solid #c3d3e8;
    border-radius: 20px;
    padding: 30px 26px;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #c3d3e8;
    background: #fff;
    color: #1f3350;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 14px;
    text-align: center;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #2c5aa0;
    color: #fff;
    box-shadow: 0 5px 0 #1c3b6e;
    margin-top: 4px;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #1c3b6e; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #52698c; min-height: 1.2em; }
  .result-body {
    font-size: 1rem;
    line-height: 1.7;
    margin: 20px 0 4px;
    color: #1f3350;
    text-align: left;
    background: #eef3f8;
    border-radius: 12px;
    padding: 16px 18px;
  }
  .footer-note { color: #52698c; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #c3d3e8;
    border-top-color: #2c5aa0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📧</div>
    <h1>Out of Office Writer</h1>
    <p class="subtitle">Enter your return date and reason, get a professional auto-reply. 100% on-device.</p>

    <div class="card">
      <input type="text" id="dateInput" placeholder="Return date, e.g. Monday, October 6th" />
      <input type="text" id="reasonInput" placeholder="Reason, e.g. attending a conference" />
      <button class="action" id="generateBtn">Write My Reply</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const dateInput = document.getElementById('dateInput');
    const reasonInput = document.getElementById('reasonInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const returnDate = dateInput.value.trim();
      const reason = reasonInput.value.trim();
      if (!returnDate || !reason) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Drafting your reply...';

      try {
        const res = await fetch('/api/ooo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ returnDate, reason }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-body">${escapeHtml(data.message)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    reasonInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
    dateInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
